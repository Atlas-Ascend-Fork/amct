[tool.pytest.ini_options]
testpaths = ["tests/unit_test", "tests/amct_pytorch"]
markers = [
    "cpu: tests that run on CPU only and are fast (default)",
    "npu: tests that require an Ascend NPU",
    "slow: tests that take more than a few seconds",
]
addopts = "-ra"
env = [
    "TORCH_DEVICE_BACKEND_AUTOLOAD=0",
]

[tool.coverage.run]
source = ["amct_pytorch"]
omit = [
    "*/experimental/*",
    "*/cli/*",
    "**/__init__.py",
    "*/common/models/llm/deepseek/*",
]

[tool.coverage.report]
show_missing = true
skip_covered = false
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]

[tool.ruff]
# Vendored third-party code (Torch-Pruning, MIT) is kept VERBATIM upstream and must not be
# reformatted/relinted — exclude it from ruff so codecheck does not modify vendored OSS
# (which would also trip the SCA third-party-OSS check). force-exclude makes the exclude
# apply even when pre-commit passes explicit filenames.
extend-exclude = ["amct_pytorch/experimental/pruning/_vendor"]
force-exclude = true
