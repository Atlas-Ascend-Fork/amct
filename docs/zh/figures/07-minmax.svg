<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#667078"/></marker></defs><rect width="1200" height="650" fill="#F6F3EC"/>
<text x="42" y="52" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="30" fill="#182027" font-weight="700" text-anchor="start">MinMax 把观测范围映射到离散数值，再重建近似浮点值</text>
<text x="42" y="88" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="17" fill="#667078" font-weight="400" text-anchor="start">教学用对称量化示例；真实实现的端点、舍入和零范围处理以量化工具函数为准</text>
<line x1="42" y1="108" x2="1158" y2="108" stroke="#D5D0C5" stroke-width="2"/>
<rect x="42" y="165" width="255" height="175" rx="5" fill="#E1EEEE" stroke="#197D8C" stroke-width="1.5"/>
<text x="169.5" y="199" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="22" fill="#197D8C" font-weight="700" text-anchor="middle">1 · 观测范围</text>
<text x="169.5" y="232" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="18" fill="#182027" font-weight="400" text-anchor="middle">示例：x ∈ [−2, 2]</text>
<text x="169.5" y="259" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="18" fill="#182027" font-weight="400" text-anchor="middle">取 max(|xmin|, |xmax|)</text>
<text x="169.5" y="286" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="18" fill="#182027" font-weight="400" text-anchor="middle">权重直接统计；激活多 batch</text>
<rect x="355" y="165" width="245" height="175" rx="5" fill="#EAE4F0" stroke="#806D9E" stroke-width="1.5"/>
<text x="477.5" y="199" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="22" fill="#806D9E" font-weight="700" text-anchor="middle">2 · 计算 scale</text>
<text x="477.5" y="232" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="18" fill="#182027" font-weight="400" text-anchor="middle">示例：qmax = 127</text>
<text x="477.5" y="259" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="18" fill="#182027" font-weight="400" text-anchor="middle">s = 2 / 127</text>
<text x="477.5" y="286" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="18" fill="#182027" font-weight="400" text-anchor="middle">s ≈ 0.01575</text>
<rect x="660" y="165" width="230" height="175" rx="5" fill="#F6EEDB" stroke="#D99A2B" stroke-width="1.5"/>
<text x="775.0" y="199" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="22" fill="#D99A2B" font-weight="700" text-anchor="middle">3 · 映射到整数</text>
<text x="775.0" y="232" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="18" fill="#182027" font-weight="400" text-anchor="middle">q = clip(round(x / s))</text>
<text x="775.0" y="259" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="18" fill="#182027" font-weight="400" text-anchor="middle">x = 1 → q ≈ 64</text>
<text x="775.0" y="286" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="18" fill="#182027" font-weight="400" text-anchor="middle">数值范围需受限</text>
<rect x="950" y="165" width="208" height="175" rx="5" fill="#E4ECE6" stroke="#4F856F" stroke-width="1.5"/>
<text x="1054.0" y="199" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="22" fill="#4F856F" font-weight="700" text-anchor="middle">4 · 重建</text>
<text x="1054.0" y="232" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="18" fill="#182027" font-weight="400" text-anchor="middle">x̂ = q × s</text>
<text x="1054.0" y="259" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="18" fill="#182027" font-weight="400" text-anchor="middle">64 × s ≈ 1.008</text>
<text x="1054.0" y="286" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="18" fill="#182027" font-weight="400" text-anchor="middle">存在舍入误差</text>
<line x1="297" y1="250" x2="350" y2="250" stroke="#667078" stroke-width="2" marker-end="url(#a)"/>
<line x1="600" y1="250" x2="655" y2="250" stroke="#667078" stroke-width="2" marker-end="url(#a)"/>
<line x1="890" y1="250" x2="945" y2="250" stroke="#667078" stroke-width="2" marker-end="url(#a)"/>
<text x="55" y="425" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="23" fill="#806D9E" font-weight="700" text-anchor="start">对称 weight-only</text>
<text x="500" y="425" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="23" fill="#182027" font-weight="400" text-anchor="start">导出 scale_w</text>
<text x="55" y="475" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="23" fill="#806D9E" font-weight="700" text-anchor="start">对称静态 MinMax</text>
<text x="500" y="475" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="23" fill="#182027" font-weight="400" text-anchor="start">导出 scale_w + scale_d</text>
<text x="55" y="531" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="20" fill="#667078" font-weight="400" text-anchor="start">非对称量化还可能导出 offset_w / offset_d。</text>
<line x1="42" y1="590" x2="1158" y2="590" stroke="#D5D0C5" stroke-width="2"/>
<text x="42" y="622" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="18" fill="#182027" font-weight="700" text-anchor="start">恢复后的 MinMaxQuant 运行 fake quant；CPU 功能通过不等于已运行 NPU 低比特算子。</text>
</svg>
