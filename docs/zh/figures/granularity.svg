<text x="46" y="45" style="font-family:Noto Sans CJK SC, Microsoft YaHei, Arial, sans-serif;font-size:30px;font-weight:700;fill:#197D8C;text-anchor:start">scale 放在哪里：per-tensor、per-channel、per-group</text>
<text x="46" y="77" style="font-family:Noto Sans CJK SC, Microsoft YaHei, Arial, sans-serif;font-size:17px;font-weight:400;fill:#667078;text-anchor:start">粒度决定误差和存储开销；测试必须核对 scale 的 shape，而不是只看文件存在。</text>
