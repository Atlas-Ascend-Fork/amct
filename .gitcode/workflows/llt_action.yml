name: llt_action 

on:
  workflow_call:
    inputs:
      ut_type:
        required: true
        type: string
      ut_package:
        type: string
        default: 'ut_cov_*.tar.gz'
      repo_name:
        type: string
        default: 'ops-nn'        

jobs:
  JOB_ut:
    name: ut
    select: selected_by_default
    needs: []
    steps:
      - 
        name: Checkout
        identifier: process_checkout
        uses: checkout
        with:
          ref: ${{ atomgit.event.pull_request.merge_commit_sha }}
          token: ${{secrets.GIT_TOKEN}}
      -
        name: download
        uses: obs-download
        with:
          endpoint: "https://obs.cn-north-4.myhuaweicloud.com"
          bucket: "ascend-ci"
          key: |
            ${{ env.obs_path }}/pr_filelist.txt
            ${{ env.obs_path }}/pr_filelist_mod.txt
          path: ${{ steps.process_checkout.outputs.path }}
      -
        name: ut
        identifier: ut
        run: |
          set -x
          cd ${{ steps.process_checkout.outputs.path }}
          echo $(grep -E "^VERSION_ID=" /etc/os-release | cut -d'"' -f2)
          sudo update-alternatives --set gcc /usr/bin/gcc-14
          gcc --version
          source /home/jenkins/Ascend/cann/bin/setenv.bash
          set +e
          echo "++++++++++++++++++++++++++++++++++++"
          echo "-----------------------------------"
          ls 
          cd .gitcode 
          ls
          cd -
          source .gitcode/assert.sh
          cat "pr_filelist.txt"
          if [ "$TARGET_BRANCH" = "feature/community-tasks" ];then
            LOG_HEAD "not need build"
            mkdir -p build_out
            touch ${WORKSPACE}/build_out/cann-amct.tar.gz
            exit 0
          else
            echo "bash build.sh -u --cann_3rd_lib_path=${ASCEND_3RD_LIB_PATH}"
            bash build.sh -u --cann_3rd_lib_path=${ASCEND_3RD_LIB_PATH}
            ret=$?
          fi

          if [ $ret -ne 200 ] && [ $ret -ne 0 ]; then
              echo "run ut fail"
              exit 1
          fi
          echo "1111111111111111111111111111"
          if [ $ret -eq 0 ]; then
              if [ "$coverage_save" = "true" ];then
                echo "ut_process=coverage" >> $ATOMGIT_OUTPUT
              else
                echo "ut_process=ut_cov" >> $ATOMGIT_OUTPUT
              fi
          fi
          exit 0 
      -
        name: ut_cov
        identifier: ut_cov
        uses: opencann/.gitcode/actions/ut-cov-report@master
        with:
          ut_process: ${{ steps.ut.outputs.ut_process }}
          workspace: ${{ steps.process_checkout.outputs.path }}
          ut_type: ${{ inputs.ut_type }}
          target_branch: ${{ env.TARGET_BRANCH }}
          git_token: ${{secrets.GIT_TOKEN}}
      -
        name: upload
        uses: obs-upload
        with:
          endpoint: "https://obs.cn-north-4.myhuaweicloud.com"
          bucket: "ascend-ci"
          access-key: ${{secrets.AK}}
          secret-key: ${{secrets.SK}}
          artifact-path: |
            ${{ steps.process_checkout.outputs.path }}/${{ inputs.ut_package }}
          object-prefix: ${{ env.obs_path }}/            
    if: "${{ default() }}"
    runs-on: [dedicate-hosted, x64, xlarge]
    container:
      image: swr.cn-south-1.myhuaweicloud.com/pre_smoke/ubuntu24.04_x86:lv6_v1.1073