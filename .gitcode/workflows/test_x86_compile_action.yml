name: test_x86_compile_action

on:
  workflow_call:
    inputs:
      task_name:
        required: true
        type: string
      image_version:
        required: true
        type: string

jobs:
  JOB_compile:
    name: compile
    select: selected_by_default
    needs: []
    steps:
      - 
        name: Checkout
        identifier: process_checkout
        uses: checkout
        with:
          ref: ${{ atomgit.event.pull_request.merge_commit_sha }}
          token: ${{secrets.GIT_TOKEN}}
      -
        name: download
        uses: obs-download
        with:
          endpoint: "https://obs.cn-north-4.myhuaweicloud.com"
          bucket: "ascend-ci"
          access-key: ${{ secrets.AK }}
          secret-key: ${{ secrets.SK }}
          key: |
            ${{ env.obs_path }}/pr_filelist.txt
            ${{ env.obs_path }}/pr_filelist_mod.txt
            ${{ env.obs_path }}/update_file_detail.txt
          path: ${{ steps.process_checkout.outputs.path }}
      -
        name: x86_compile_acc
        identifier: compile
        uses: build-accelerate
        with:
          command: |
            WORKSPACE=${{ steps.process_checkout.outputs.path }}
            GIT_TARGET_BRANCH=${{ env.target_branch }}
            cd ${WORKSPACE}
            echo $(grep -E "^VERSION_ID=" /etc/os-release | cut -d'"' -f2)
            if [[ "${{ inputs.task_name }}" == "x86_compile_ubuntu24" ]]; then
              cd ${{ steps.process_checkout.outputs.path }}
              echo $(grep -E "^VERSION_ID=" /etc/os-release | cut -d'"' -f2)
              sudo update-alternatives --set gcc /usr/bin/gcc-14
              gcc --version
              source /home/jenkins/Ascend/cann/bin/setenv.bash
              set -e
              cd ${{ steps.process_checkout.outputs.path }}
              echo $(grep -E "^VERSION_ID=" /etc/os-release | cut -d'"' -f2)
              sudo update-alternatives --set gcc /usr/bin/gcc-14
              gcc --version
              source /home/jenkins/Ascend/cann/bin/setenv.bash
              set -e
              cd ${{ steps.process_checkout.outputs.path }}
              echo $(grep -E "^VERSION_ID=" /etc/os-release | cut -d'"' -f2)
              sudo update-alternatives --set gcc /usr/bin/gcc-14
              gcc --version
              REPOSITORY_NAME=${{ env.repo_name }}
              WORKSPACE=${{ steps.process_checkout.outputs.path }}
              GIT_PR_NUMBER=${{ env.MERGE_ID }}
              BRANCH=${{ env.source_branch }}
              GIT_TARGET_BRANCH=${{ env.target_branch }}
              sed -i "1i set(CMAKE_EXPORT_COMPILE_COMMANDS ON)" "CMakeLists.txt"
              bash build.sh --pkg --jit --cann_3rd_lib_path=/home/jenkins/opensource -j16
              echo "exec cmd: [bash build.sh --pkg --jit --cann_3rd_lib_path=/home/jenkins/opensource -j16]"
              python /home/api-doc/APIInfoGenTool/ops_analyser.py -t ${REPOSITORY_NAME} -c ${WORKSPACE}/build/ -o /home/api_result -p ${WORKSPACE} --list pr_filelist_mod.txt --mode full --driver_path=${ASCEND_3RD_LIB_PATH} --diff_file update_file_detail.txt
              python /home/api-doc/APIInfoGenTool/uploadData.py \
                  -o /home/api_result -t ${REPOSITORY_NAME} \
                  --git_url "https://gitcode.com/cann/${REPOSITORY_NAME}/pull/${GIT_PR_NUMBER}" \
                  --branch "${BRANCH}" --key ${GIT_PR_NUMBER} \
                  -su "https://gitcode.com/cann/${REPOSITORY_NAME}/pull/${GIT_PR_NUMBER}" \
                  -sb "${BRANCH}" \
                  -tu "https://gitcode.com/cann/${REPOSITORY_NAME}.git" \
                  -tb "${GIT_TARGET_BRANCH}" \
                  --server_url "http://10.0.0.193:10001/api/import" \
                    --mode full \
                    --prefix ${WORKSPACE} \
                    --driver_path=/home/jenkins/opensource
                  python /home/api-doc/APIInfoGenTool/usabilityCheck.py --target ${REPOSITORY_NAME} --out_dir /home/api_result --key ${GIT_PR_NUMBER} --git_url https://gitcode.com/cann/${REPOSITORY_NAME}/pull/${GIT_PR_NUMBER} --branch ${BRANCH} --server_url http://10.0.0.193:10005/check
                  ret=$?
                  # 200 表示跳过编译，属于正常情况
                  if [ $ret -eq 200 ]; then
                    echo "not need compile"
                    mkdir build_out
                    touch build_out/cann-910b-ops-nn_9.1.0_linux-x86_64.run
                    exit 0
                  fi
                  compile_package_name=$(ls "${{ steps.process_checkout.outputs.path }}/build_out/" |grep -E "*.run$"|head -n1)
                  echo "compile package name is: ${compile_package_name}"
                  mv build_out/cann-910b-ops-nn_9.1.0_linux-x86_64.run build_out/cann-910b-ops-nn_9.1.0_linux-x86_64_ubuntu24.run
                  exit $ret   
            else
              if [[ "${{ inputs.task_name }}" == *ubuntu24* ]]; then
                sudo update-alternatives --set gcc /usr/bin/gcc-14
                package_name="cann-ops-nn_linux-x86_64_ubuntu24.run"
              else
                if [[ -f "/opt/rh/devtoolset-7/enable" ]]; then
                  echo "source devtoolset"
                  source /opt/rh/devtoolset-7/enable
                fi
                if [[ "${{ inputs.task_name }}" == *mobile_station* && "${{ env.target_branch }}" == "master" ]];then
                wget -nv https://kiri-obs.obs.cn-north-4.myhuaweicloud.com/Cann%20Large%20Model%20Foundation%208.5.0.beta005/cann-bisheng-compiler_9.0.0_linux-x86_64.run
                chmod +x *.run
                sudo -u jenkins ./*.run --full --quiet --install-path=/home/jenkins/Ascend
                source /home/jenkins/Ascend/cann/bin/setenv.bash
                bash build.sh --pkg --soc=kirinx90 --cann_3rd_lib_path=/home/jenkins/opensource -j16
                echo "exec cmd: [bash build.sh --pkg --soc=kirinx90 --cann_3rd_lib_path=/home/jenkins/opensource -j16]"
                fi
                if [[ "${{ inputs.task_name }}" == *950* ]]; then
                
              fi
            fi
              package_name="cann-ops-nn_linux-x86_64.run"
            fi
            echo ${package_name}
            echo "package_name=${package_name}" >> $ATOMGIT_OUTPUT
            gcc --version
            source /home/jenkins/Ascend/cann/bin/setenv.bash
            set +e
            BuildAccelerate bash build.sh --cann_3rd_lib_path="/home/jenkins/opensource" -f "pr_filelist.txt"
            ret=$?

            # 200 表示跳过编译，属于正常情况
            if [ $ret -eq 200 ]; then
              echo "not need compile"
              mkdir build_out
              touch build_out/${package_name}
              exit 0
            fi
            if [ $ret -eq 0 ]; then
              compile_package_name=$(ls "${WORKSPACE}/build_out" |grep -E "*.run$"|head -n1)
              mv ${WORKSPACE}/build_out/${compile_package_name} ${WORKSPACE}/build_out/${package_name}
            fi
            exit $ret
          AC_SERVER_IP: 172.16.17.59:172.16.19.40:172.16.31.165:172.16.34.255:172.16.41.196:172.16.42.176:172.16.45.205:172.16.45.224:172.16.50.164:172.16.9.158
      -
        name: api_check
        uses: cann-actions/api-check@master
        with:
          org_name: ${{ env.org_name }}
          task_name: ${{ inputs.task_name }}
          repo_name: ${{ env.repo_name }}
          merge_id: ${{ env.MERGE_ID }}
          workspace: ${{ steps.process_checkout.outputs.path }}
          source_branch: ${{ env.SOURCE_BRANCH }}
          target_branch: ${{ env.TARGET_BRANCH }}
      - name: upload
        uses: obs-upload
        with:
          endpoint: "https://obs.cn-north-4.myhuaweicloud.com"
          bucket: "ascend-ci"
          access-key: ${{ secrets.AK }}
          secret-key: ${{ secrets.SK }}
          artifact-path: "${{ steps.process_checkout.outputs.path }}/build_out/${{ steps.compile.outputs.package_name }}"
          object-prefix: ${{ env.obs_path }}/  
    if: "${{ default() }}"
    runs-on: [dedicated-hosted, x64, large]
    container:
      image: swr.cn-north-4.myhuaweicloud.com/ci_cann/${{ inputs.image_version }}