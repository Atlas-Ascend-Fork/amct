              REPOSITORY_NAME=${{ inputs.repo_name }}
              WORKSPACE=${{ steps.process_checkout.outputs.path }}
              GIT_PR_NUMBER=${{ inputs.pr_number }}
              BRANCH=${{ inputs.source_branch }}
              GIT_TARGET_BRANCH=${{ inputs.target_branch }}
              sed -i "1i set(CMAKE_EXPORT_COMPILE_COMMANDS ON)" "CMakeLists.txt"
              bash build.sh --pkg --jit --cann_3rd_lib_path=/home/jenkins/opensource -j16
              echo "exec cmd: [bash build.sh --pkg --jit --cann_3rd_lib_path=/home/jenkins/opensource -j16]"
              python /home/api-doc/APIInfoGenTool/ops_analyser.py -t ${REPOSITORY_NAME} -c ${WORKSPACE}/build/ -o /home/api_result -p ${WORKSPACE} --list pr_filelist_mod.txt --mode full --driver_path=${ASCEND_3RD_LIB_PATH} --diff_file update_file_detail.txt
              python /home/api-doc/APIInfoGenTool/uploadData.py \
                  -o /home/api_result -t ${REPOSITORY_NAME} \
                  --git_url "https://gitcode.com/cann/${REPOSITORY_NAME}/pull/${GIT_PR_NUMBER}" \
                  --branch "${BRANCH}" --key ${GIT_PR_NUMBER} \
                  -su "https://gitcode.com/cann/${REPOSITORY_NAME}/pull/${GIT_PR_NUMBER}" \
                  -sb "${BRANCH}" \
                  -tu "https://gitcode.com/cann/${REPOSITORY_NAME}.git" \
                  -tb "${GIT_TARGET_BRANCH}" \
                  --server_url "http://10.0.0.193:10001/api/import" \
                    --mode full \
                    --prefix ${WORKSPACE} \
                    --driver_path=/home/jenkins/opensource
                  python /home/api-doc/APIInfoGenTool/usabilityCheck.py --target ${REPOSITORY_NAME} --out_dir /home/api_result --key ${GIT_PR_NUMBER} --git_url https://gitcode.com/cann/${REPOSITORY_NAME}/pull/${GIT_PR_NUMBER} --branch ${BRANCH} --server_url http://10.0.0.193:10005/check
              ret=$?
              ret=$?
              # 200 表示跳过编译，属于正常情况
              if [ $ret -eq 200 ]; then
                echo "not need compile"
                mkdir build_out
                touch build_out/cann-910b-ops-nn_9.1.0_linux-x86_64.run
                exit 0
              fi
              compile_package_name=$(ls "${{ steps.process_checkout.outputs.path }}/build_out/" |grep -E "*.run$"|head -n1)
              echo "compile package name is: ${compile_package_name}"
              mv build_out/cann-910b-ops-nn_9.1.0_linux-x86_64.run build_out/cann-910b-ops-nn_9.1.0_linux-x86_64_ubuntu24.run
              exit $ret       
          - name: upload
            uses: obs-upload
            with:
              endpoint: "https://obs.cn-north-4.myhuaweicloud.com"
              bucket: "ascend-ci"
              access-key: ${{secrets.AK}}
              secret-key: ${{secrets.SK}}
              artifact-path: "${{ steps.process_checkout.outputs.path }}/build_out/*.run"
              object-prefix: "test/"
        if: "${{ default() }}"
        runs-on: [dedicate-hosted, x64, large]
        container:
          image: swr.cn-south-1.myhuaweicloud.com/pre_smoke/ubuntu24.04_x86:lv6_v1.1076
