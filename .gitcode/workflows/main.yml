                  exit 0
              else
                  echo "not need build single"
                  mkdir single
                  touch single.tar.gz
                  exit 0
              fi
              ret=$?

              # 200 表示跳过编译，属于正常情况
              if [ $ret -eq 200 ]; then
                echo "not need compile"
                mkdir build_out
                touch build_out/cann-ops-nn_linux-x86_64.run
                exit 0
