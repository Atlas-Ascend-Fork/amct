name: ops_nn_action_cyj

on: 
  workflow_dispatch:
    inputs:
      build_id:
        required: true
        type: number
      org:
        type: string 
        default: 'cann'
      repo_name:
        type: string
        default: 'ops-nn'
      target_branch:
        type: string
        default: 'master'
      source_branch:
        type: string
        default: 'master'
      pr_number:
        type: string
        default: '4'
      commit_id:
        type: string
        default : 'qweqeqweqeq'
  # pull_request_comment:
  #   types: [created]
  # pr_comment:
  #   types: [ created ]
  #   keyword: 'qw'
  pull_request_comment:
    types: [created, edit, deleted ]
    branches: [ '*' ]
    comments: [ '^qw$' ]
  workflow_call:
    secrets:
      GIT_TOKEN:
        description: 'A token passed from the caller workflow'
        required: true

env:
  org_name: "opencann"
  obs_path: "test/ops-nn/package/${{ env.MERGE_ID }}"
  CI_PATH: "https://gitcode.com/tanghaoran7/cann_ci.git"
  repo_name: "ops-nn"
  

stages:
  stage1:
    name: image
    select: selected_by_default
    jobs:
      JOB_image:
        name: image
        select: selected_by_default
        needs: []
        steps:
          - 
            name: Checkout
            identifier: process_checkout
            uses: checkout
            with:
              fetch-depth: 1
              token: ${{secrets.GIT_TOKEN}}
          -
            name: pip_install
            run: |
              pip3 install Pyyaml --trusted-host mirrors.huaweicloud.com -i https://mirrors.huaweicloud.com/repository/pypi/simple
          - name: revise_image
            identifier: revise_image
            uses: ./.gitcode/actions/revise-img
            with:
              repo_name: ${{ env.repo_name }}
              target_branch: ${{ env.TARGET_BRANCH }}
          -
            name: show_output
            run: |
              echo "image: ${{ steps.revise_image.outputs.Compile_Ascend_ARM }}"
        if: "${{ default() }}"
        runs-on: 
        - default
      JOB_pr:  
        name: get_pr_files
        select: selected_by_default
        needs: []
        steps:
          - 
            name: Checkout
            identifier: process_checkout
            uses: checkout
            with:
              ref: ${{ atomgit.event.pull_request.merge_commit_sha }}
              # ref: refs/merge-requests/${{ inputs.pr_number }}/head
              token: ${{secrets.GIT_TOKEN}}
          -
            name: get_pr
            identifier: get_pr
            uses: ./.gitcode/actions/get-pr
            with:
              workspace: ${{ steps.process_checkout.outputs.path }}
              target_branch: ${{ env.TARGET_BRANCH }}
              git_token: ${{secrets.GIT_TOKEN}}
            # run: |
            #   target_branch=${{ inputs.target_branch }}
            #   cd ${{ steps.process_checkout.outputs.path }}
            #   ls -lh
            #   git fetch --unshallow
            #   git branch
            #   git branch -r
            #   git submodule update --init --depth 1 --recursive
            #   # 找到 PR 与主干的公共祖先（真正的对比基准）
            #   BASE=$(git merge-base HEAD origin/${target_branch})
            #   echo "PR 基准 commit: $BASE"
            #   git diff $BASE HEAD --stat
            #   git -c core.quotePath=false diff $BASE HEAD --name-status > pr_filelist_mod.txt
            #   git -c core.quotePath=false diff $BASE HEAD --name-only > pr_filelist.txt
            #   git -c core.quotePath=false diff $BASE...HEAD --name-only --diff-filter=AM > pr_filelist_precommit.txt
            #   git -c core.quotePath=false diff -U0 -w --no-renames $BASE...HEAD > update_file_detail.txt
            #   cat pr_filelist_mod.txt
            #   cat pr_filelist.txt
            #   cat pr_filelist_precommit.txt
            #   touch gitdiff.txt
            #   while IFS= read -r line;do  if [[ -f $line && $line == *.md ]];then echo "------${line}" >>gitdiff.txt; git diff $BASE $line >> gitdiff.txt;  fi; done < pr_filelist.txt
          - 
            name: upload
            uses: obs-upload
            with:
              endpoint: "https://obs.cn-north-4.myhuaweicloud.com"
              bucket: "ascend-ci"
              access-key: ${{secrets.AK}}
              secret-key: ${{secrets.SK}}
              artifact-path: |
                ${{ steps.process_checkout.outputs.path }}/pr_filelist.txt
                ${{ steps.process_checkout.outputs.path }}/pr_filelist_mod.txt
                ${{ steps.process_checkout.outputs.path }}/pr_filelist_precommit.txt
                ${{ steps.process_checkout.outputs.path }}/update_file_detail.txt
              object-prefix: ${{ env.obs_path }}/
        runs-on: 
        - default
    pre:
    - type: auto
    fail-fast: true
  stage2:
    name: compile
    select: selected_by_default
    jobs:
      JOB_codecheck_action:
        name: codecheck_action
        select: selected_by_default
        needs: []
        uses: .gitcode/workflows/codecheck_action.yml
      JOB_Pre_compile:
        name: Pre_compile
        select: selected_by_default
        needs: []
        steps:
          - 
            name: Checkout
            identifier: process_checkout
            uses: checkout
            with:
              fetch-depth: 1
              ref: ${{ atomgit.event.pull_request.merge_commit_sha }}
          -
            name: download
            uses: obs-download
            with:
              endpoint: "https://obs.cn-north-4.myhuaweicloud.com"
              bucket: "ascend-ci"
              key: "test/pr_filelist.txt"
              path: ${{ steps.process_checkout.outputs.path }}
          -
            name: compile
            run: |
              cd ${{ steps.process_checkout.outputs.path }}
              echo $(grep -E "^VERSION_ID=" /etc/os-release | cut -d'"' -f2)
              source /home/jenkins/Ascend/cann/bin/setenv.bash
              bash build.sh --pkg --ops="fatrelu_mul" --cann_3rd_lib_path=/home/jenkins/opensource
              echo "build fatrelu_mul"
              ls build_out
              mv build_out/*.run ${{ steps.process_checkout.outputs.path }}/build_out/cann-ops-nn-fatrelu_mul_linux-aarch64.run
              ls build_out
              exit 0
              set -e
              ret=$?

              # 200 表示跳过编译，属于正常情况
              if [ $ret -eq 200 ]; then
                echo "not need compile"
                mkdir build_out
                touch build_out/cann-ops-nn_linux-x86_64.run
                exit 0
              fi
              exit $ret       
          - name: upload
            uses: obs-upload
            with:
              endpoint: "https://obs.cn-north-4.myhuaweicloud.com"
              bucket: "ascend-ci"
              access-key: ${{secrets.AK}}
              secret-key: ${{secrets.SK}}
              artifact-path: "${{ steps.process_checkout.outputs.path }}/build_out/*.run"
              object-prefix: "test/"
        if: "${{ default() }}"
        runs-on:  [dedicate-hosted, Arm64, large]
        # runs-on: 
        # - default  
        container:
          image: swr.cn-south-1.myhuaweicloud.com/pre_smoke/ubuntu24.04_arm:lv6_v1.1075
      JOB_x86_compile:
        name: x86_compile
        select: selected_by_default
        needs: []
        steps:
          - 
            name: Checkout
            identifier: process_checkout
            uses: checkout
            with:
              ref: ${{ atomgit.event.pull_request.merge_commit_sha }}
              # ref: refs/merge-requests/${{ inputs.pr_number }}/head
          -
            name: download
            uses: obs-download
            with:
              endpoint: "https://obs.cn-north-4.myhuaweicloud.com"
              bucket: "ascend-ci"
              key: "test/pr_filelist.txt"
              path: ${{ steps.process_checkout.outputs.path }}
          -
            name: compile
            run: |
              cd ${{ steps.process_checkout.outputs.path }}
              echo $(grep -E "^VERSION_ID=" /etc/os-release | cut -d'"' -f2)
              if [[ -f "/opt/rh/devtoolset-7/enable" ]]; then
                  echo "source devtoolset"
                  source /opt/rh/devtoolset-7/enable
              fi
              source /home/jenkins/Ascend/cann/bin/setenv.bash
              set -e
              bash build.sh --pkg --jit --cann_3rd_lib_path=/home/jenkins/opensource -j16
              echo "exec cmd: [bash build.sh --pkg --soc=kirinx90 --cann_3rd_lib_path=${ASCEND_3RD_LIB_PATH} -j16]"
              ret=$?

              # 200 表示跳过编译，属于正常情况
              if [ $ret -eq 200 ]; then
                echo "not need compile"
                mkdir build_out
                touch build_out/cann-ops-nn_linux-x86_64.run
                exit 0
              fi
              exit $ret       
          - name: upload
            uses: obs-upload
            with:
              endpoint: "https://obs.cn-north-4.myhuaweicloud.com"
              bucket: "ascend-ci"
              access-key: ${{secrets.AK}}
              secret-key: ${{secrets.SK}}
              artifact-path: "${{ steps.process_checkout.outputs.path }}/build_out/*.run"
              object-prefix: "test/"
        if: "${{ default() }}"
        runs-on:  [dedicate-hosted, x64, large]  
        container:
          image: swr.cn-south-1.myhuaweicloud.com/pre_smoke/ubuntu24.04_x86:lv6_v1.1076
      JOB_x86_compile_ubuntu24:
        name: x86_compile_ubuntu24
