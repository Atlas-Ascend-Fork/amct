syntax = "proto2";
package AMCTPytorchPostQuantProto;

message AMCTPostQuantConfig {
    optional uint32 batch_num = 1 [default = 1];
    optional WeightOnlyConfig weight_only_config = 10;
    optional CalibrationConfig common_config = 100;
    repeated string skip_layers = 200;
}

message WeightOnlyConfig {
    optional bool weight_compress_only = 1 [default = false];
    optional WtsQuantGranularity weight_granularity = 2 [default = PER_TENSOR];
    optional QuantType wts_type = 3 [default = INT8];
    optional RoundMode round_mode = 4;
    optional uint32 group_size = 5;
    optional bool wts_asymmetric = 6 [default = false];

    oneof wts_quant_algo{
        AWQuantize awq_quantize = 100;
        LUTQuantize lut_quantize = 110;
        GPTQuantize gptq_quantize = 120;
    }
}

message GPTQuantize {}

message AWQuantize {
    optional uint32 grids_num = 1 [default = 20];
}

message LUTQuantize {
    optional LUTQuantAlgo lut_algo = 1 [default = CLUSTER];
}

message CalibrationConfig {
    optional QuantType act_type = 1 [default = INT8];
    optional QuantType wts_type = 2 [default = INT8]; 
    optional WtsQuantGranularity weight_granularity = 3 [default = PER_TENSOR];
    optional ActQuantGranularity act_granularity = 4 [default = PER_TENSOR];
    optional RoundMode round_mode = 5;
    optional bool act_asymmetric = 6 [default = false];
    optional ActSmooth act_smooth = 7;
    enum ActQuantGranularity {
        PER_TENSOR = 0;
        PER_TOKEN = 1;
    }
}

message ActSmooth {
    optional float smooth_strength = 1 [default = 0.5];
}

enum RoundMode {
    ROUND = 0;
    HYBRID = 1;
    RINT=2;
}

enum QuantType {
    HIFLOAT8 = 0;
    FLOAT8_E4M3FN = 1;
    INT8 = 10;
    INT4 = 11;
    MXFP4_E2M1 = 12;
    MXFP8_E4M3FN = 13;
    FLOAT4_E2M1 = 14;
    FLOAT4_E1M2 = 15;
}

enum WtsQuantGranularity {
    PER_TENSOR = 0;
    PER_CHANNEL = 1;
    PER_GROUP = 2;
}

enum LUTQuantAlgo {
    ARCTAN = 0;
    CLUSTER = 1;
}