syntax = "proto2";
import "amct_pytorch_inner/amct_pytorch/proto/basic_info.proto";
package AMCTPytorchRecordProto;

message SingleLayerRecord {
    repeated float scale_d = 1;
    repeated int32 offset_d = 2;

    repeated float scale_w = 3;

    optional string act_type = 11;
    optional string wts_type = 12;

    optional string round_mode = 21;
    optional bool weight_compress_only = 22;
    optional string quant_result_path = 23;
    optional int32 group_size = 50;
}

message MapFiledEntry {
    optional string key = 1;
    optional SingleLayerRecord value = 2;
}

message ScaleOffsetRecord {
    repeated MapFiledEntry record = 1;
}