<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 250" font-family="'Microsoft YaHei','PingFang SC','Noto Sans CJK SC','WenQuanYi Micro Hei',sans-serif">
  <rect x="0" y="0" width="900" height="250" fill="#ffffff"/>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#5f6368"/></marker>
    <style>
      text{font-size:13px;fill:#111;text-anchor:middle}
      .s{font-size:11px;fill:#444}
      .edge{stroke:#5f6368;stroke-width:1.5;fill:none;marker-end:url(#a)}
      .dash{stroke:#9AA0A6;stroke-width:1.5;fill:none;stroke-dasharray:5 4;marker-end:url(#a)}
      .step{fill:#E8F0FE;stroke:#4285F4;stroke-width:1.5}
      .done{fill:#E6F4EA;stroke:#34A853;stroke-width:1.5}
      .note{fill:#FEF7E0;stroke:#F9AB00;stroke-width:1.5}
    </style>
  </defs>

  <path class="edge" d="M156,106 L182,106"/>
  <path class="edge" d="M361,106 L387,106"/>
  <path class="edge" d="M541,106 L567,106"/>
  <path class="edge" d="M756,106 L782,106"/>
  <path class="dash" d="M273,140 L273,172"/>

  <rect class="step" x="16" y="80" width="140" height="52" rx="7"/>
  <text x="86" y="102">模型</text><text class="s" x="86" y="120">（已加载权重）</text>

  <rect class="step" x="186" y="72" width="175" height="68" rx="7"/>
  <text x="273" y="94">1) 结构化剪枝</text><text class="s" x="273" y="112">预算 =</text><text class="s" x="273" y="128">tolerance &#215; 0.5</text>

  <rect class="step" x="391" y="80" width="150" height="52" rx="7"/>
  <text x="466" y="102">测量实际</text><text class="s" x="466" y="120">剪枝精度下降</text>

  <rect class="step" x="571" y="72" width="185" height="68" rx="7"/>
  <text x="663" y="94">2) 在剪枝模型上</text><text class="s" x="663" y="112">量化搜索</text><text class="s" x="663" y="128">预算 = tolerance &#8722; 下降</text>

  <rect class="done" x="784" y="80" width="108" height="52" rx="7"/>
  <text x="838" y="102">3) amct.convert</text><text class="s" x="838" y="120">&#8594; 部署</text>

  <rect class="note" x="93" y="172" width="360" height="52" rx="7"/>
  <text class="s" x="273" y="194">剪枝后形状改变，量化校准</text><text class="s" x="273" y="210">仅在剪枝后权重上才正确</text>
</svg>
