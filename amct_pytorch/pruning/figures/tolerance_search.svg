<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 456" font-family="DejaVu Sans, Arial, sans-serif">
  <rect x="0" y="0" width="600" height="456" fill="#ffffff"/>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#5f6368"/>
    </marker>
    <style>
      text{font-size:13px;fill:#111;text-anchor:middle}
      .s{font-size:11px;fill:#444}
      .edge{stroke:#5f6368;stroke-width:1.5;fill:none;marker-end:url(#a)}
      .lbl{font-size:11px;fill:#5f6368;text-anchor:middle}
      .step{fill:#E8F0FE;stroke:#4285F4;stroke-width:1.5}
      .dec{fill:#FEF7E0;stroke:#F9AB00;stroke-width:1.5}
      .done{fill:#E6F4EA;stroke:#34A853;stroke-width:1.5}
    </style>
  </defs>

  <!-- edges -->
  <path class="edge" d="M300,64 L300,90"/>
  <path class="edge" d="M300,136 L300,162"/>
  <path class="edge" d="M300,224 L300,248"/>
  <path class="edge" d="M370,292 L392,292"/>
  <path class="edge" d="M230,292 L208,292"/>
  <polyline class="edge" points="480,270 480,82 312,82 312,90"/>
  <polyline class="edge" points="112,270 112,82 288,82 288,90"/>
  <path class="edge" d="M300,336 L300,388"/>
  <text class="lbl" x="384" y="284">yes</text>
  <text class="lbl" x="216" y="284">no</text>

  <!-- nodes -->
  <rect class="step" x="175" y="16" width="250" height="48" rx="7"/>
  <text x="300" y="38">ratio_grid (ascending)</text><text class="s" x="300" y="56">0.1  0.2  ...  0.8</text>

  <rect class="step" x="195" y="90" width="210" height="46" rx="7"/>
  <text x="300" y="118">binary search over the grid</text>

  <rect class="step" x="110" y="162" width="380" height="62" rx="7"/>
  <text x="300" y="184">probe candidate r:</text><text class="s" x="300" y="202">prune a copy &#8594; (optional finetune) &#8594;</text><text class="s" x="300" y="218">measure quality drop vs. original</text>

  <polygon class="dec" points="300,248 372,292 300,336 228,292"/>
  <text x="300" y="296">drop &#8804; tolerance?</text>

  <rect class="done" x="392" y="266" width="196" height="52" rx="7"/>
  <text x="490" y="288">r is feasible</text><text class="s" x="490" y="306">&#8594; try a larger r</text>

  <rect class="dec" x="12" y="266" width="196" height="52" rx="7"/>
  <text x="110" y="288">r is too aggressive</text><text class="s" x="110" y="306">&#8594; try a smaller r</text>

  <rect class="done" x="150" y="388" width="300" height="56" rx="7"/>
  <text x="300" y="410">apply the largest feasible r</text><text class="s" x="300" y="428">prune / forward failure = unacceptable</text>
</svg>
