<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 462" font-family="DejaVu Sans, Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#5f6368"/>
    </marker>
    <style>
      text{font-size:13px;fill:#111;text-anchor:middle}
      .s{font-size:11px;fill:#444}
      .edge{stroke:#5f6368;stroke-width:1.5;fill:none;marker-end:url(#a)}
      .lbl{font-size:11px;fill:#5f6368;text-anchor:middle}
      .step{fill:#E8F0FE;stroke:#4285F4;stroke-width:1.5}
      .cand{fill:#F3E8FD;stroke:#A142F4;stroke-width:1.5}
      .dec{fill:#FEF7E0;stroke:#F9AB00;stroke-width:1.5}
      .done{fill:#E6F4EA;stroke:#34A853;stroke-width:1.5}
    </style>
  </defs>

  <!-- edges -->
  <path class="edge" d="M290,64 L120,106"/>
  <path class="edge" d="M300,64 L300,106"/>
  <path class="edge" d="M310,64 L480,106"/>
  <path class="edge" d="M107,160 L262,208"/>
  <path class="edge" d="M300,160 L300,208"/>
  <path class="edge" d="M492,160 L338,208"/>
  <path class="edge" d="M300,262 L300,280"/>
  <path class="edge" d="M348,338 L430,392"/>
  <path class="edge" d="M252,338 L170,392"/>
  <text class="lbl" x="404" y="372">yes</text>
  <text class="lbl" x="190" y="372">no / tie</text>

  <!-- nodes -->
  <rect class="step" x="150" y="16" width="300" height="48" rx="7"/>
  <text x="300" y="38">one calibration pass</text><text class="s" x="300" y="56">(shared by all candidates)</text>

  <rect class="cand" x="15" y="106" width="184" height="54" rx="7"/>
  <text x="107" y="128">fallback candidate</text><text class="s" x="107" y="146">recovery=none / moe=mass</text>
  <rect class="cand" x="208" y="106" width="184" height="54" rx="7"/>
  <text x="300" y="128">candidate</text><text class="s" x="300" y="146">recovery=bias / moe=cond_var</text>
  <rect class="cand" x="401" y="106" width="184" height="54" rx="7"/>
  <text x="493" y="128">candidate</text><text class="s" x="493" y="146">recovery=ls / moe=peak, cvxpeak</text>

  <rect class="step" x="150" y="208" width="300" height="54" rx="7"/>
  <text x="300" y="230">evaluate every candidate on a</text><text class="s" x="300" y="248">held-out validation set (eval_data)</text>

  <polygon class="dec" points="300,280 364,320 300,360 236,320"/>
  <text x="300" y="316">a candidate strictly</text><text class="s" x="300" y="332">beats the fallback?</text>

  <rect class="done" x="330" y="392" width="200" height="50" rx="7"/>
  <text x="430" y="422">apply the winner</text>
  <rect class="done" x="70" y="392" width="200" height="50" rx="7"/>
  <text x="170" y="422">keep the safe fallback</text>
</svg>
