# Kimi-K3 inference scheme:
# - MLA/KDA attention linears: MXFP8 A8W8
# - Routed experts w1/w2/w3: MXFP4 A8W4
# - Shared experts and latent MoE projections: MXFP8 A8W8
# - MLA q/kv/p cache tensors: FP8
w_bits: 8
a_bits: 8

attn-linear:
  w_bits: 8
  a_bits: 8
  q_a_proj: { w_bits: 8, a_bits: 8 }
  q_b_proj: { w_bits: 8, a_bits: 8 }
  kv_a_proj_with_mqa: { w_bits: 8, a_bits: 8 }
  o_proj: { w_bits: 8, a_bits: 8 }

moe:
  routed:
    w_bits: 4
    a_bits: 4
    routed_expert_down_proj:
      w_bits: 8
      a_bits: 8
    routed_expert_up_proj:
      w_bits: 8
      a_bits: 8
  shared:
    w_bits: 8
    a_bits: 8

attn-cache:
  q: 8
  kv: 8
  p: 8
