# W4A16 weight-only, group-wise INT4 on the MoE experts.
#
# a_bits: 16 means activations are NOT quantized (weight-only): the layer runs
# fp16 activations against group-wise INT4 weights, dequantized on the NPU by
# npu_weight_quant_batchmatmul (antiquant). The deploy export packs eight int4
# weights per int32 with one fp32 scale per group and a zero antiquant offset.
#
# group_size is a BitPolicy field alongside w_bits / a_bits: the weight-quant
# group size along input channels (one scale per that many channels instead of
# one per full output row). It resolves most-specific-first just like the bit
# widths; -1 (the default) means per-channel. It is only meaningful for 4-bit
# weight-only weights at deploy-export time. Per-channel INT4 is too lossy for
# the 30B MoE weights; group-wise (g64) is needed to hold precision.

# Attention + dense MLP stay fp16; weight-only INT4 targets the MoE experts.
w_bits: 16
a_bits: 16

moe:
  w_bits: 4
  a_bits: 16
  group_size: 64
  # To split routed vs shared experts, move the entry into sub-blocks, e.g.:
  #   routed: { w_bits: 4,  a_bits: 16, group_size: 64 }
  #   shared: { w_bits: 16, a_bits: 16 }   # keep shared experts fp16
