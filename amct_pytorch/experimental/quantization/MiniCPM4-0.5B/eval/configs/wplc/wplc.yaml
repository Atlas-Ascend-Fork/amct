task: wplc
dataset_path: json
dataset_kwargs:
  data_files:
    test: COMMON_DATA_PATH/wplc/dev_cleaned.jsonl
validation_split: test
output_type: generate_until
doc_to_text: "使用句子中出现的词，在以下句子的括号处填写{{num_mask}}个字，以完成这个句子。待完成的句子：\n{{question}}\n只回答需要填写的词，不要做其他说明和解释。"
doc_to_target: "{{answer}}"
metric_list:
  - metric: !function utils.wplc_score
    aggregation: mean
    higher_is_better: true
    ignore_punctuation: true
    ignore_case: true
filter_list:
  - name: "wplc_filter"
    filter:
      - function: !function utils.WPLCTextfilter
generation_kwargs:
  do_sample: false
  temperature: 0.0
  max_gen_toks: 16
metadata:
  version: 1.0