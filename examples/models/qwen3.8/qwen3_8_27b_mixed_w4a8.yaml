# Qwen3.8-27B mixed W4A8 policy validated with gptq_diag.
# MLP defaults to W4A8. Attention keeps its main QKV projections at W8A8 and
# lowers the auxiliary/input-output projections listed below to W4A8.
w_bits: 4
a_bits: 8

attn-linear:
  w_bits: 8
  a_bits: 8
  in_proj_z:
    w_bits: 4
    a_bits: 8
  in_proj_b:
    w_bits: 4
    a_bits: 8
  in_proj_a:
    w_bits: 4
    a_bits: 8
  out_proj:
    w_bits: 4
    a_bits: 8
  o_proj:
    w_bits: 4
    a_bits: 8
