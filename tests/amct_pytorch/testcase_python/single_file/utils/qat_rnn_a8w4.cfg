# global quantize parameter (RNN: activation INT8, weight INT4 per-channel)
retrain_data_quant_config: {
    ulq_quantize: { dst_type: INT8 }
}
retrain_weight_quant_config: {
    arq_retrain: { channel_wise: true; dst_type: INT4 }
}
override_layer_types : {
    layer_type: "Linear"
    retrain_weight_quant_config: {
        arq_retrain: { channel_wise: false; dst_type: INT4 }
    }
}
override_layer_types : {
    layer_type: "Conv1d"
    retrain_weight_quant_config: {
        arq_retrain: { channel_wise: false; dst_type: INT4 }
    }
}
